<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#050203" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QWX POKER" />
  <title>QWX POKER — закрытый клуб</title>
  <!-- скрипт Telegram грузим только когда игра открыта как мини-приложение (в обычном браузере — лишний запрос) -->
  <script>if (/tgWebApp/.test(location.hash + location.search) || window.TelegramWebviewProxy) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
  <meta name="description" content="Подпольный покер-клуб в 3D: Texas Hold'em с друзьями прямо в браузере" />
  <!-- самое тяжёлое качаем сразу, параллельно с кодом: модель рук, их текстуры, сукно и бортик -->
  <script>
    // 3D-режим: самое тяжёлое качаем сразу, параллельно с кодом. В 2D эти файлы не нужны — не качаем.
    (function () {
      var v = ''; try { v = localStorage.getItem('pn.view') || ''; } catch (e) {}
      if (v === '2d') return;
      [['models/hands.bin', 'fetch'], ['models/hand_diffuse.jpg', 'image'], ['textures/manifest.json', 'fetch'],
       ['textures/felt-56172a-2048.map.webp', 'image'], ['textures/railwood-1024.map.webp', 'image']].forEach(function (f) {
        var l = document.createElement('link'); l.rel = 'preload'; l.href = f[0]; l.as = f[1]; if (f[1] === 'fetch') l.crossOrigin = 'anonymous';
        document.head.appendChild(l);
      });
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- шрифты: Bodoni Moda — заголовки клуба, Manrope — интерфейс, Playfair — индексы карт и надписи кнопок -->
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;0,6..96,800;1,6..96,500;1,6..96,600&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="splash" id="splash">
    <div class="splash-glow"></div>
    <div class="logo">
      <div class="suits"><i>♠</i><i class="r">♥</i><i>♣</i><i class="r">♦</i></div>
      <h1><span>Q</span><span>W</span><span>X</span><em>POKER</em></h1>
      <p>закрытый клуб</p>
    </div>
    <div class="loader">
      <div class="track"><div class="fill" id="load-bar"></div></div>
      <div class="meta"><span id="load-label" class="in">Открываем двери клуба</span><b id="load-pct">0%</b></div>
    </div>
  </div>
  <div id="stage"></div>
  <div class="vignette"></div>
  <div class="grain"></div>
  <script type="module" src="/src/client/main.ts"></script>
</body>
</html>
